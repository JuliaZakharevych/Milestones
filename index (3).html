<style>
@font-face{font-family:'e-Ukraine';src:url('https://raw.githubusercontent.com/JuliaZakharevych/Fonts/main/e-Ukraine-Regular.woff2') format('woff2');font-weight:400;font-style:normal;font-display:swap}
@font-face{font-family:'e-Ukraine';src:url('https://raw.githubusercontent.com/JuliaZakharevych/Fonts/main/e-Ukraine-Light.woff2') format('woff2');font-weight:300;font-style:normal;font-display:swap}
@font-face{font-family:'e-Ukraine';src:url('https://raw.githubusercontent.com/JuliaZakharevych/Fonts/main/e-Ukraine-Bold.woff2') format('woff2');font-weight:700;font-style:normal;font-display:swap}
@font-face{font-family:'e-Ukraine Head';src:url('https://raw.githubusercontent.com/JuliaZakharevych/Fonts/main/e-UkraineHead-Bold.woff2') format('woff2');font-weight:700;font-style:normal;font-display:swap}
*{box-sizing:border-box}html,body{height:100%;margin:0;background:#F5F5F5;color:#111827;font-family:'e-Ukraine',Arial,sans-serif}
.wrap{height:100%;display:flex;flex-direction:column;max-width:1000px;margin:0 auto}
.hd{flex:none;padding:16px 24px 10px;background:#F5F5F5;z-index:10}
.row{display:flex;justify-content:space-between;align-items:flex-end;gap:16px}
h1{font-family:'e-Ukraine',Arial,sans-serif;font-weight:700}
h1{margin:0;font-size:28px;line-height:34px;letter-spacing:-.01em}.sub{margin:2px 0 0;font-size:15px;line-height:22px;color:#6B7280}
.ct{display:flex;flex-direction:column;align-items:flex-end;justify-content:flex-end;gap:0;text-align:right;min-width:0;white-space:nowrap}.ct b{display:inline-block;font-size:40px;line-height:44px;color:#0B3CEA;font-variant-numeric:tabular-nums}.ct span{font-size:15px;line-height:20px;color:#333}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{border:1px solid #C9CDD3;background:#fff;color:#111827;font:inherit;font-size:14px;line-height:20px;padding:3px 12px;border-radius:16px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:.2s}
.chip i{width:9px;height:9px;border-radius:50%;background:var(--c)}.chip:hover{border-color:#111827}.chip.on{background:#111827;color:#fff;border-color:#111827}
.pg{height:4px;background:#E0E0E0;flex:none}.pg i{display:block;height:100%;width:0;background:#0B3CEA}
.sc{flex:1;overflow-y:auto;padding:0 24px 40px;scroll-behavior:smooth}
.tl{position:relative;padding:8px 0}
.tl:before{content:"";position:absolute;left:50%;top:0;bottom:0;width:3px;margin-left:-1px;background:#D4D4D4}
.yr{position:relative;z-index:3;text-align:center;padding:14px 0 12px}
.yr span{display:inline-block;background:#111827;color:#fff;font-weight:700;font-size:18px;line-height:26px;padding:3px 16px;border-radius:16px}
.ev{display:grid;grid-template-columns:1fr 44px 1fr;margin-top:-140px;position:relative}
.ev.yrn{margin-top:0}
.ev .card{grid-row:1;grid-column:1;margin-right:8px}
.ev.r .card{grid-column:3;margin-right:0;margin-left:8px}
.dot{grid-row:1;grid-column:2;justify-self:center;margin-top:20px;width:16px;height:16px;border-radius:50%;background:var(--c);border:4px solid #F5F5F5;box-sizing:content-box;z-index:2;transition:transform .25s}
.ev.act .dot{transform:scale(1.5)}
.card{position:relative;background:#fff;border-radius:8px;border-left:4px solid var(--c);overflow:hidden;align-self:start;transition:box-shadow .25s,transform .25s}
.card:before{content:"";position:absolute;top:27px;right:-8px;width:8px;height:2px;background:var(--c);z-index:2}
.ev.r .card:before{right:auto;left:-12px}
.ev.act .card{box-shadow:0 8px 28px rgba(17,24,39,.18);transform:translateY(-2px)}
.ph{margin:0;position:relative;aspect-ratio:16/9;background:#E0E0E0;overflow:hidden}.ph img{display:block;width:100%;height:100%;object-fit:cover;transition:transform .6s}
.card:hover .ph img{transform:scale(1.05)}
.ph span{position:absolute;left:8px;bottom:8px;background:rgba(17,24,39,.75);color:#fff;font-size:12px;line-height:16px;padding:2px 8px;border-radius:4px}
.bd{padding:14px 18px 16px}
.top{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:6px}.top b{font-size:20px;line-height:28px}
.ar{font-size:13px;line-height:18px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--t)}
.tx{margin:0;font-size:16px;line-height:24px;color:#333}.kf{margin:8px 0 0;font-size:16px;line-height:24px;font-weight:700;color:#0B3CEA}
.mm{margin:10px 0 0;padding-top:8px;border-top:1px solid #E8E8E8;font-size:14px;line-height:20px;color:#6B7280}.mm b{color:#111827}
@media (max-width:700px){.hd{padding:12px 14px 8px}h1{font-size:19px;line-height:24px}.sub{display:none}.ct{min-width:0;gap:0}.ct b{font-size:28px;line-height:32px}.ct span{font-size:12px;line-height:16px}
.chips{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}.chip{flex:none}
.sc{padding:0 14px 32px}.tl:before{left:11px}.yr{text-align:left;padding-left:0}
.ev,.ev.yrn{grid-template-columns:26px 1fr;margin-top:14px}.ev.yrn{margin-top:0}
.ev .card,.ev.r .card{grid-column:2;margin:0}.dot{grid-column:1;justify-self:start;margin-left:3px}.card:before{display:none}
.bd{padding:12px 14px 14px}.top b{font-size:18px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
